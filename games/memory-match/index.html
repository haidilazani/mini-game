<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Match — Mini Game</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --accent: #0ea5e9;
      --bg: #f4f6fb;
      --text: #1d2233;
      --soft: #69708c;
      --ease-pop: cubic-bezier(.34, 1.56, .64, 1);
    }
    button { font-family: inherit; }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 600px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px 8px;
    }
    .back-link {
      color: var(--soft);
      text-decoration: none;
      font-size: .9rem;
      font-weight: 600;
      padding: 8px 14px;
      border: 1px solid #e2e6f2;
      border-radius: 999px;
      background: #fff;
      transition: color .2s, border-color .2s, transform .2s;
    }
    .back-link:hover { color: var(--accent); border-color: var(--accent); transform: translateX(-3px); }
    h1 { font-size: 1.15rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }

    .toolbar {
      width: 100%;
      max-width: 600px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 20px;
      flex-wrap: wrap;
    }
    .modes { display: flex; gap: 8px; }
    .mode-btn, .restart {
      padding: 9px 18px;
      border: 1px solid #e2e6f2;
      border-radius: 999px;
      background: #fff;
      color: var(--soft);
      font-size: .85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s;
    }
    .mode-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .mode-btn:not(.active):hover, .restart:hover { border-color: var(--accent); color: var(--accent); }

    .stats {
      display: flex;
      gap: 16px;
      font-size: .9rem;
      color: var(--soft);
      font-variant-numeric: tabular-nums;
    }
    .stats b { color: var(--text); margin-left: 4px; }

    .board {
      width: min(92vw, 560px);
      display: grid;
      gap: 10px;
      padding: 4px 0 40px;
    }
    .board.easy { grid-template-columns: repeat(4, 1fr); }
    .board.hard { grid-template-columns: repeat(6, 1fr); }

    .cardm {
      aspect-ratio: 1;
      background: none;
      border: none;
      cursor: pointer;
      perspective: 700px;
    }
    .inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform .45s var(--ease-pop);
    }
    .cardm.flipped .inner, .cardm.matched .inner { transform: rotateY(180deg); }

    .face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: grid;
      place-items: center;
      border-radius: 14px;
      font-size: clamp(1.3rem, 6vw, 2rem);
    }
    .front {
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: rgba(255, 255, 255, .85);
      box-shadow: 0 4px 12px rgba(37, 99, 235, .25), inset 0 1px 0 rgba(255,255,255,.35);
      font-size: 1.1rem;
    }
    .cardm:not(.flipped):not(.matched):hover .inner { transform: rotateY(14deg) scale(1.04); }
    .back {
      transform: rotateY(180deg);
      background: #fff;
      box-shadow: 0 4px 12px rgba(35, 46, 84, .12);
      border: 1px solid #e9ecf5;
    }
    .cardm.matched .back {
      background: #ecfdf5;
      border-color: #a7f3d0;
      animation: pop .45s var(--ease-pop);
    }
    @keyframes pop { 50% { transform: rotateY(180deg) scale(1.12); } 100% { transform: rotateY(180deg) scale(1); } }
    .cardm.matched { cursor: default; }

    /* win overlay */
    .overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(20, 26, 50, .45);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s;
      z-index: 10;
      padding: 20px;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }
    .win-card {
      background: #fff;
      border-radius: 24px;
      padding: 40px 48px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(20, 26, 50, .35);
      transform: scale(.7);
      transition: transform .4s var(--ease-pop);
    }
    .overlay.show .win-card { transform: scale(1); }
    .win-card .emoji { font-size: 3rem; }
    .win-card h2 { font-size: 1.6rem; margin: 8px 0 4px; }
    .win-card p { color: var(--soft); line-height: 1.7; }
    .win-card .record { color: #d97706; font-weight: 700; }
    .win-card button {
      margin-top: 18px;
      padding: 12px 30px;
      border: none;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform .2s var(--ease-pop), filter .2s;
    }
    .win-card button:hover { transform: scale(1.06); filter: brightness(1.1); }
  </style>
</head>
<body>

  <header>
    <a class="back-link" href="../../index.html">← Mini Game</a>
    <h1>🧠 Memory Match</h1>
    <span></span>
  </header>

  <div class="toolbar">
    <div class="modes">
      <button class="mode-btn active" id="easyBtn">Easy 4×4</button>
      <button class="mode-btn" id="hardBtn">Hard 6×6</button>
    </div>
    <div class="stats">
      <span>Moves<b id="moves">0</b></span>
      <span>Time<b id="time">0:00</b></span>
      <span>Best<b id="bestStat">—</b></span>
    </div>
    <button class="restart" id="restartBtn">↺ Restart</button>
  </div>

  <main class="board easy" id="board"></main>

  <div class="overlay" id="overlay">
    <div class="win-card">
      <div class="emoji">🎉</div>
      <h2>You matched them all!</h2>
      <p id="winStats"></p>
      <button id="againBtn">Play again</button>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      const EMOJIS = ["🦊","🐙","🌵","🍩","🚀","🌈","🎈","🐝","🍓","🦄","⚡","🎧","🌙","🍕","🐳","⛺","🎲","🧊"];

      const board = document.getElementById("board");
      const movesEl = document.getElementById("moves");
      const timeEl = document.getElementById("time");
      const bestEl = document.getElementById("bestStat");
      const overlay = document.getElementById("overlay");
      const winStats = document.getElementById("winStats");
      const easyBtn = document.getElementById("easyBtn");
      const hardBtn = document.getElementById("hardBtn");

      let size = 4;
      let first = null, lock = false;
      let moves = 0, matched = 0, seconds = 0;
      let timerId = null, started = false;

      const fmtTime = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
      const bestKey = () => `mm_best_${size}`;

      function shuffle(a) {
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function renderBest() {
        const raw = localStorage.getItem(bestKey());
        bestEl.textContent = raw ? `${JSON.parse(raw).moves} moves` : "—";
      }

      function stopTimer() { clearInterval(timerId); timerId = null; }

      function build() {
        stopTimer();
        first = null; lock = false;
        moves = 0; matched = 0; seconds = 0; started = false;
        movesEl.textContent = "0";
        timeEl.textContent = "0:00";
        overlay.classList.remove("show");
        board.className = `board ${size === 4 ? "easy" : "hard"}`;
        renderBest();

        const pairs = (size * size) / 2;
        const deck = shuffle([...shuffle([...EMOJIS]).slice(0, pairs).flatMap((e) => [e, e])]);

        board.innerHTML = "";
        for (const emoji of deck) {
          const btn = document.createElement("button");
          btn.className = "cardm";
          btn.dataset.emoji = emoji;
          btn.setAttribute("aria-label", "Memory card");
          btn.innerHTML = `<span class="inner"><span class="face front">✦</span><span class="face back">${emoji}</span></span>`;
          btn.addEventListener("click", () => flip(btn));
          board.appendChild(btn);
        }
      }

      function startTimer() {
        started = true;
        timerId = setInterval(() => {
          seconds++;
          timeEl.textContent = fmtTime(seconds);
        }, 1000);
      }

      function flip(card) {
        if (lock || card === first || card.classList.contains("matched")) return;
        if (!started) startTimer();

        card.classList.add("flipped");

        if (!first) { first = card; return; }

        moves++;
        movesEl.textContent = moves;

        if (first.dataset.emoji === card.dataset.emoji) {
          first.classList.add("matched");
          card.classList.add("matched");
          first.classList.remove("flipped");
          card.classList.remove("flipped");
          first = null;
          matched++;
          if (matched === (size * size) / 2) win();
        } else {
          const a = first, b = card;
          first = null;
          lock = true;
          setTimeout(() => {
            a.classList.remove("flipped");
            b.classList.remove("flipped");
            lock = false;
          }, 700);
        }
      }

      function win() {
        stopTimer();
        const raw = localStorage.getItem(bestKey());
        const prev = raw ? JSON.parse(raw) : null;
        const isRecord = !prev || moves < prev.moves || (moves === prev.moves && seconds < prev.secs);
        if (isRecord) localStorage.setItem(bestKey(), JSON.stringify({ moves, secs: seconds }));

        winStats.innerHTML =
          `<b>${moves}</b> moves · <b>${fmtTime(seconds)}</b>` +
          (isRecord ? `<br><span class="record">🏆 New personal best!</span>` : "");
        renderBest();
        setTimeout(() => overlay.classList.add("show"), 500);
      }

      easyBtn.addEventListener("click", () => {
        size = 4;
        easyBtn.classList.add("active");
        hardBtn.classList.remove("active");
        build();
      });
      hardBtn.addEventListener("click", () => {
        size = 6;
        hardBtn.classList.add("active");
        easyBtn.classList.remove("active");
        build();
      });
      document.getElementById("restartBtn").addEventListener("click", build);
      document.getElementById("againBtn").addEventListener("click", build);

      build();
    })();
  </script>
</body>
</html>
