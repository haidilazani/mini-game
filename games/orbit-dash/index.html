<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbit Dash — Mini Game</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪐</text></svg>" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --accent: #8f7bff; --gold: #ffd166; --danger: #ff5470; }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #0b0e1f;
      color: #eef0ff;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 580px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px 14px;
    }
    .back {
      color: #9aa1c9;
      text-decoration: none;
      font-size: .9rem;
      font-weight: 600;
      padding: 8px 14px;
      border: 1px solid #262c4e;
      border-radius: 999px;
      transition: color .2s, border-color .2s, transform .2s;
    }
    .back:hover { color: #fff; border-color: var(--accent); transform: translateX(-3px); }
    h1 { font-size: 1.15rem; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }

    .hud {
      display: flex;
      gap: 18px;
      font-variant-numeric: tabular-nums;
      font-size: .9rem;
      color: #9aa1c9;
    }
    .hud b { color: #fff; font-size: 1.05rem; margin-left: 5px; }

    .stage {
      position: relative;
      width: min(92vw, 540px);
      aspect-ratio: 1;
      margin-bottom: 28px;
      touch-action: manipulation;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 26px;
      background: radial-gradient(circle at 50% 42%, #1a2042 0%, #0d1128 55%, #070a18 100%);
      box-shadow: 0 22px 50px rgba(0, 0, 0, .55), inset 0 0 0 1px #232a52;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      background: rgba(6, 8, 20, .58);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      border-radius: 26px;
      transition: opacity .3s ease;
    }
    .overlay.hidden { opacity: 0; pointer-events: none; }
    .overlay .panel { padding: 24px; }
    .overlay h2 {
      font-size: clamp(1.8rem, 6vw, 2.6rem);
      font-weight: 900;
      letter-spacing: .06em;
      background: linear-gradient(135deg, var(--accent), #ff5ca8);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .overlay .big-score { font-size: 2.2rem; font-weight: 800; margin: 8px 0 2px; }
    .overlay .sub { color: #9aa1c9; font-size: .95rem; margin-top: 10px; line-height: 1.6; }
    .overlay .key {
      display: inline-block;
      padding: 2px 9px;
      border: 1px solid #3a4170;
      border-bottom-width: 3px;
      border-radius: 7px;
      font-size: .82rem;
      background: #161b38;
    }
    .pulse { animation: pulse 1.2s ease infinite alternate; }
    @keyframes pulse { to { opacity: .55; } }

    footer { color: #5a608c; font-size: .8rem; padding-bottom: 26px; }
  </style>
</head>
<body>

  <header>
    <a class="back" href="../../index.html">← Mini Game</a>
    <h1>🪐 Orbit Dash</h1>
    <div class="hud">
      <span>Score<b id="score">0</b></span>
      <span>Best<b id="best">0</b></span>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="overlay" id="overlay">
      <div class="panel" id="panel">
        <h2>ORBIT DASH</h2>
        <p class="sub">
          You orbit the planet on two lanes.<br />
          <span class="key">tap</span> or <span class="key">space</span> to swap lanes.<br />
          Dodge the <b style="color:var(--danger)">shards</b> · collect the <b style="color:var(--gold)">stars</b>.
        </p>
        <p class="sub pulse" style="margin-top:18px">— tap anywhere to launch —</p>
      </div>
    </div>
  </div>

  <footer>It only gets faster. Good luck.</footer>

  <script>
    (() => {
      "use strict";

      const cv = document.getElementById("cv");
      const ctx = cv.getContext("2d");
      const stage = document.getElementById("stage");
      const overlay = document.getElementById("overlay");
      const panel = document.getElementById("panel");
      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");

      // ---------- Sizing ----------
      let W = 0, H = 0, CX = 0, CY = 0;
      function resize() {
        const rect = cv.getBoundingClientRect();
        const dpr = devicePixelRatio || 1;
        cv.width = rect.width * dpr;
        cv.height = rect.height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        W = rect.width; H = rect.height;
        CX = W / 2; CY = H / 2;
      }
      resize();
      addEventListener("resize", resize);

      const LANE_F = [0.40, 0.66];                       // lane radius as fraction of half-size
      const laneR = (i) => LANE_F[i] * Math.min(W, H) / 2;
      const angDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));
      const rand = (lo, hi) => lo + Math.random() * (hi - lo);

      // ---------- Static starfield ----------
      const bgStars = Array.from({ length: 70 }, () => ({
        x: Math.random(), y: Math.random(),
        r: rand(0.4, 1.5), tw: rand(0, Math.PI * 2), sp: rand(0.5, 2),
      }));

      // ---------- State ----------
      let state = "menu";                                // menu | play | over
      let ship = null, items = [], parts = [], trail = [];
      let score = 0, elapsed = 0, speed = 0, spawnT = 0, diedAt = 0;
      let best = +(localStorage.getItem("od_best") || 0);
      bestEl.textContent = best;

      function start() {
        ship = { a: -Math.PI / 2, lane: 1, r: laneR(1) };
        items = []; parts = []; trail = [];
        score = 0; elapsed = 0; speed = 1.5; spawnT = 1.0;
        state = "play";
        overlay.classList.add("hidden");
      }

      // ---------- Spawning ----------
      function spawn() {
        if (items.length > 13) return;
        items.push({
          type: Math.random() < 0.62 ? "spike" : "star",
          lane: Math.random() < 0.5 ? 0 : 1,
          a: ship.a + rand(2.2, 5.8),                    // always ahead of the ship
          age: 0,
          life: 9,
          spin: rand(0, Math.PI * 2),
        });
      }

      function burst(x, y, color, n) {
        for (let i = 0; i < n; i++) {
          const a = Math.random() * Math.PI * 2;
          const v = rand(40, 230);
          parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, color, r: rand(1.5, 4) });
        }
      }

      const shipXY = () => ({ x: CX + Math.cos(ship.a) * ship.r, y: CY + Math.sin(ship.a) * ship.r });

      function die() {
        state = "over";
        diedAt = performance.now();
        const p = shipXY();
        burst(p.x, p.y, "#ff5470", 46);
        burst(p.x, p.y, "#ffd166", 22);
        const final = Math.floor(score);
        if (final > best) { best = final; localStorage.setItem("od_best", best); bestEl.textContent = best; }
        panel.innerHTML = `
          <h2>CRASHED!</h2>
          <div class="big-score">${final}</div>
          <p class="sub">best: <b style="color:#fff">${best}</b>${final >= best && final > 0 ? " · 🏆 new record!" : ""}</p>
          <p class="sub pulse" style="margin-top:16px">— tap to fly again —</p>`;
        setTimeout(() => overlay.classList.remove("hidden"), 550);
      }

      // ---------- Update ----------
      function update(dt) {
        elapsed += dt;
        speed = Math.min(1.5 + elapsed * 0.035, 3.4);
        ship.a += speed * dt;
        ship.r += (laneR(ship.lane) - ship.r) * Math.min(1, dt * 12);

        const p = shipXY();
        trail.push({ x: p.x, y: p.y });
        if (trail.length > 22) trail.shift();

        spawnT -= dt;
        if (spawnT <= 0) {
          spawn();
          spawnT = Math.max(0.5, 1.05 - elapsed * 0.01);
        }

        score += dt * 10;                                // survival points
        scoreEl.textContent = Math.floor(score);

        const shipRad = Math.min(W, H) * 0.022;
        for (const it of items) {
          it.age += dt;
          it.spin += dt * 1.6;
          if (it.dead) continue;
          // same lane (incl. mid-swap) and close enough along the arc?
          const lr = laneR(it.lane);
          if (Math.abs(ship.r - lr) > Math.min(W, H) * 0.035) continue;
          const arc = Math.abs(angDiff(ship.a, it.a));
          if (arc > (shipRad + Math.min(W, H) * 0.026) / lr) continue;

          if (it.type === "star") {
            it.dead = true;
            score += 50;
            burst(CX + Math.cos(it.a) * lr, CY + Math.sin(it.a) * lr, "#ffd166", 16);
          } else if (it.age > 0.5) {                     // brief grace while fading in
            die();
            return;
          }
        }
        items = items.filter((it) => !it.dead && it.age < it.life);
      }

      function updateParts(dt) {
        for (const pt of parts) {
          pt.x += pt.vx * dt; pt.y += pt.vy * dt;
          pt.vx *= 0.985; pt.vy *= 0.985;
          pt.vy += 60 * dt;
          pt.life -= dt * 1.4;
        }
        parts = parts.filter((pt) => pt.life > 0);
      }

      // ---------- Drawing ----------
      function starPath(x, y, r, rot) {
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const rr = i % 2 === 0 ? r : r * 0.45;
          const a = rot + (i / 10) * Math.PI * 2 - Math.PI / 2;
          ctx[i ? "lineTo" : "moveTo"](x + Math.cos(a) * rr, y + Math.sin(a) * rr);
        }
        ctx.closePath();
      }

      function spikePath(x, y, r, rot) {
        ctx.beginPath();
        for (let i = 0; i < 16; i++) {
          const rr = i % 2 === 0 ? r : r * 0.5;
          const a = rot + (i / 16) * Math.PI * 2;
          ctx[i ? "lineTo" : "moveTo"](x + Math.cos(a) * rr, y + Math.sin(a) * rr);
        }
        ctx.closePath();
      }

      function draw(now) {
        ctx.clearRect(0, 0, W, H);
        const t = now / 1000;

        // twinkling backdrop
        for (const s of bgStars) {
          ctx.globalAlpha = 0.25 + 0.55 * Math.abs(Math.sin(s.tw + t * s.sp));
          ctx.fillStyle = "#cdd4ff";
          ctx.beginPath();
          ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        // lane rings
        for (let i = 0; i < 2; i++) {
          ctx.beginPath();
          ctx.arc(CX, CY, laneR(i), 0, Math.PI * 2);
          ctx.strokeStyle = "rgba(143, 123, 255, .22)";
          ctx.lineWidth = 1.5;
          ctx.setLineDash([3, 8]);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        // planet
        const pr = Math.min(W, H) * 0.13;
        const grad = ctx.createRadialGradient(CX - pr * 0.35, CY - pr * 0.4, pr * 0.1, CX, CY, pr);
        grad.addColorStop(0, "#b9a8ff");
        grad.addColorStop(0.55, "#7c5ce0");
        grad.addColorStop(1, "#3b2a80");
        ctx.save();
        ctx.shadowColor = "rgba(143, 123, 255, .8)";
        ctx.shadowBlur = 34;
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(CX, CY, pr, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        // planet ring
        ctx.save();
        ctx.translate(CX, CY);
        ctx.rotate(-0.45);
        ctx.scale(1, 0.32);
        ctx.beginPath();
        ctx.arc(0, 0, pr * 1.6, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(255, 209, 102, .5)";
        ctx.lineWidth = 4;
        ctx.stroke();
        ctx.restore();

        // items
        const ir = Math.min(W, H) * 0.026;
        for (const it of items) {
          const fadeIn = Math.min(it.age / 0.4, 1);
          const fadeOut = Math.min((it.life - it.age) / 1, 1);
          ctx.globalAlpha = Math.min(fadeIn, fadeOut);
          const x = CX + Math.cos(it.a) * laneR(it.lane);
          const y = CY + Math.sin(it.a) * laneR(it.lane);
          ctx.save();
          if (it.type === "spike") {
            ctx.shadowColor = "#ff5470";
            ctx.shadowBlur = 14;
            ctx.fillStyle = "#ff5470";
            spikePath(x, y, ir, it.spin * 0.4);
            ctx.fill();
          } else {
            ctx.shadowColor = "#ffd166";
            ctx.shadowBlur = 16;
            ctx.fillStyle = "#ffd166";
            starPath(x, y, ir * 1.05, it.spin);
            ctx.fill();
          }
          ctx.restore();
        }
        ctx.globalAlpha = 1;

        // trail + ship
        if (state !== "menu" && trail.length) {
          for (let i = 0; i < trail.length; i++) {
            ctx.globalAlpha = (i / trail.length) * 0.4;
            ctx.fillStyle = "#8f7bff";
            ctx.beginPath();
            ctx.arc(trail[i].x, trail[i].y, 2 + (i / trail.length) * 4, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
          if (state === "play") {
            const p = shipXY();
            ctx.save();
            ctx.shadowColor = "#fff";
            ctx.shadowBlur = 18;
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(p.x, p.y, Math.min(W, H) * 0.022, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        }

        // particles
        for (const pt of parts) {
          ctx.globalAlpha = Math.max(pt.life, 0);
          ctx.fillStyle = pt.color;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      // ---------- Loop ----------
      let last = performance.now();
      function loop(now) {
        const dt = Math.min((now - last) / 1000, 0.033);
        last = now;
        if (state === "play") update(dt);
        updateParts(dt);
        draw(now);
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);

      // ---------- Input ----------
      function action() {
        if (state === "menu") start();
        else if (state === "play") ship.lane = 1 - ship.lane;
        else if (state === "over" && performance.now() - diedAt > 600) start();
      }
      stage.addEventListener("pointerdown", action);
      addEventListener("keydown", (e) => {
        if ((e.code === "Space" || e.code === "ArrowUp" || e.code === "Enter") && !e.repeat) {
          e.preventDefault();
          action();
        }
      });
    })();
  </script>
</body>
</html>
